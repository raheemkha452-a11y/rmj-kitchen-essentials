<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Change Password | RMJ Admin</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>RMJ Admin</h2>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>

            <li><a href="products.html"><i class="fa-solid fa-box"></i> Products</a></li>

            <li><a href="orders.html"><i class="fa-solid fa-cart-shopping"></i> Orders</a></li>

            <li><a href="users.html"><i class="fa-solid fa-users"></i> Users</a></li>

            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Website Settings</a></li>

            <li><a href="profile.html"><i class="fa-solid fa-user"></i> Admin Profile</a></li>

            <li class="active"><a href="change-password.html"><i class="fa-solid fa-key"></i> Change Password</a></li>

            <li><a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main-content">

        <div class="profile-card">

            <h2>

                <i class="fa-solid fa-key"></i>

                Change Password

            </h2>

            <form id="passwordForm">

                <div class="form-group">

                    <label>Current Password</label>

                    <input
                    type="password"
                    id="currentPassword"
                    required>

                </div>

                <div class="form-group">

                    <label>New Password</label>

                    <input
                    type="password"
                    id="newPassword"
                    required>

                </div>

                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                    type="password"
                    id="confirmPassword"
                    required>

                </div>

                <button
                class="save-btn"
                type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Change Password

                </button>

            </form>

        </div>

    </div>

</div>

<script src="../js/change-password.js"></script>

</body>

</html>
