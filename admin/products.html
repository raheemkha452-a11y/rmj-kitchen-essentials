<div class="admin-content">

<h1>Product Management</h1>

<form class="product-form" id="productForm" enctype="multipart/form-data">

<input
type="text"
id="productName"
placeholder="Product Name">

<input
type="number"
id="productPrice"
placeholder="Price">

<input
type="text"
id="productCategory"
placeholder="Category">

<input
type="number"
id="productStock"
placeholder="Stock">

<textarea
id="productDescription"
placeholder="Product Description">
</textarea>

<div class="input-box">

<label>Product Image</label>

<input
type="file"
id="productImage"
accept="image/*">

</div>
<button id="addProductBtn">

<i class="fa-solid fa-plus"></i>

Add Product

</button>

</form>

<h2>All Products</h2>

<table class="product-table">

<thead>

<tr>

<th>ID</th>

<th>Image</th>

<th>Name</th>

<th>Price</th>

<th>Category</th>

<th>Stock</th>

<th>Action</th>

</tr>

</thead>

<tbody id="productTable">

</tbody>

</table>

</div>

</div>

alert(document.getElementById("productTable"));
