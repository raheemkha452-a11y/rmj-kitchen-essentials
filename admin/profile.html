<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Profile | RMJ Admin</title>

<link rel="stylesheet" href="../css/admin.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<div class="admin-container">

    <!-- Sidebar -->

    <div class="sidebar">

        <h2>RMJ Admin</h2>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>

            <li><a href="products.html"><i class="fa-solid fa-box"></i> Products</a></li>

            <li><a href="orders.html"><i class="fa-solid fa-cart-shopping"></i> Orders</a></li>

            <li><a href="users.html"><i class="fa-solid fa-users"></i> Users</a></li>

            <li><a href="settings.html"><i class="fa-solid fa-gear"></i> Website Settings</a></li>

            <li class="active"><a href="profile.html"><i class="fa-solid fa-user"></i> Admin Profile</a></li>
            <li>
    <a href="change-password.html">
        <i class="fa-solid fa-key"></i>
        Change Password
    </a>
</li>

            <li><a href="../login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

        </ul>

    </div>

    <!-- Main -->

    <div class="main-content">

        <div class="profile-card">

            <h2>

                <i class="fa-solid fa-user-gear"></i>

                Admin Profile

            </h2>

            <div class="profile-image">

                <img
                id="profilePreview"
                src="../images/admin.png"
                alt="Admin">

            </div>

            <form id="profileForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                    type="text"
                    id="adminName">

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                    type="email"
                    id="adminEmail">

                </div>

                <div class="form-group">

                    <label>Phone</label>

                    <input
                    type="text"
                    id="adminPhone">

                </div>

                <div class="form-group">

                    <label>Profile Photo</label>

                    <input
                    type="file"
                    id="adminImage">

                </div>

                <button
                class="save-btn"
                type="submit">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Update Profile

                </button>

            </form>

        </div>

    </div>

</div>

<script src="../js/profile.js"></script>

</body>

</html>
