<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Forgot Password | RMJ Kitchen Essentials</title>

<link rel="stylesheet" href="css/style.css">

</head>

<body>
<header>
<nav class="navbar">

    <a href="index.html" class="logo">
        <img src="images/logo.jpeg" alt="RMJ Logo">
    </a>

    <!-- Desktop Menu -->
    <ul class="nav-links" id="navLinks">

        <li><a href="index.html">Home</a></li>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="my-orders.html">My Orders</a></li>

    </ul>

    <!-- Right Side Icons -->

    <div class="nav-icons">

        <!-- Mobile Shop -->
        <a href="shop.html" class="mobile-shop">
            <i class="fa-solid fa-store"></i>
        </a>

        <!-- Cart -->
        <a href="cart.html" class="cart-icon">
            <i class="fa-solid fa-cart-shopping"></i>
        </a>

        <!-- Login -->
        <a href="login.html" id="loginMenu" class="login-btn">
            Login
        </a>

        <!-- Profile -->
        <div id="profileMenu" style="display:none;"></div>

        <!-- Hamburger -->
        <div class="menu-toggle" id="menuToggle">
            <i class="fa-solid fa-bars"></i>
        </div>

    </div>

</nav>
</header>


<section class="login-section">

<div class="login-container">

<div class="login-box">

<h2>Forgot Password</h2>

<p>Enter your registered email address.</p>

<form id="forgotForm">

<div class="input-box">

<label>Email Address</label>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

</div>

<button
type="submit"
class="btn login-btn">

Continue

</button>

</form>

</div>

</div>

</section>

<script>

document.getElementById("forgotForm").addEventListener("submit", async function(e){

e.preventDefault();

const email=document.getElementById("email").value;

const response=await fetch("/api/check-email",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email})

});

const data=await response.json();

if(data.success){

window.location.href="reset-password.html?email="+email;

}else{

alert(data.message);

}

});

</script>


</body>


</html>
